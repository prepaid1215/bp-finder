<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3157d5">
<title>BP파인더 새 주소 안내</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#eef2fa;color:#17213a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7}main{width:100%;max-width:440px;padding:32px 26px;background:white;border:1px solid #e2e7f1;border-radius:24px;box-shadow:0 16px 50px #233b7310}.brand{font-size:13px;letter-spacing:2px;font-weight:800;color:#3157d5}h1{font-size:25px;line-height:1.45;margin:16px 0}p{font-size:15px;color:#58637a}a{display:block;padding:14px;text-align:center;background:#3157d5;border-radius:12px;color:white;text-decoration:none;font-weight:750;margin:24px 0 12px}a:focus-visible{outline:3px solid #101e50;outline-offset:4px}.url{font-size:13px;text-align:center;overflow-wrap:anywhere}.help{margin-top:24px;padding:18px;background:#f4f6fb;border-radius:12px;font-size:14px}.help strong{display:block;margin-bottom:8px}ol{padding-left:20px;margin:0}.timer{font-size:13px;margin-bottom:0;text-align:center}
</style>
</head>
<body>
<main>
<div class="brand">BP FINDER+</div>
<h1>BP파인더 주소가<br>변경되었습니다</h1>
<p>기존 주소에서는 서비스 이용이 종료되었습니다.<br>모든 기능은 새 주소에서 이용해 주세요.</p>
<a href="https://bp-finder.vercel.app/" target="_top">새 BP파인더 열기 →</a>
<div class="url">https://bp-finder.vercel.app/</div>
<div class="help"><strong>홈 화면에 저장해 두셨나요?</strong><ol><li>새 BP파인더를 열어 주세요.</li><li>새 주소를 홈 화면에 추가해 주세요.</li><li>기존 BP파인더 아이콘은 삭제해 주세요.</li></ol></div>
<p class="timer">8초 후 새 주소로 자동 이동합니다.</p>
</main>
<script>
if (location.hostname === "prepaid1215.github.io") {
  setTimeout(function () { location.replace("https://bp-finder.vercel.app/"); }, 8000);
} else {
  location.replace("/");
}
</script>
</body>
</html>
