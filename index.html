let map, marker;

function run() {
    kakao.maps.load(() => {
        const query = document.getElementById('q').value.trim();
        if(!query) return;

        const ps = new kakao.maps.services.Places();
        // 행정복지센터 위주로 검색하여 지역의 중심점을 먼저 찾음
        const searchQuery = query.includes('행정복지센터') ? query : query + " 행정복지센터";

        ps.keywordSearch(searchQuery, (data, status) => {
            if (status === kakao.maps.services.Status.OK) {
                showLocationList(data);
            } else {
                // 센터로 안나올 경우 일반 장소 검색
                ps.keywordSearch(query, (data2, status2) => {
                    if(status2 === kakao.maps.services.Status.OK) showLocationList(data2);
                    else alert("지역을 찾지 못했습니다.");
                });
            }
        });
    });
}

// 2. 검색 리스트 노출 (부산 및 주요 번화가 우선 정렬)
function showLocationList(list) {
    const box = document.getElementById('loc-list');
    box.innerHTML = '';
    
    const sortedList = list.sort((a, b) => {
        const aAddr = a.address_name;
        const bAddr = b.address_name;

        // 1순위: '부산' 포함 여부
        const aBusan = aAddr.includes('부산') ? 1 : 0;
        const bBusan = bAddr.includes('부산') ? 1 : 0;
        if (aBusan !== bBusan) return bBusan - aBusan;

        // 2순위: 주요 번화가(부전동, 연산동 등) 가중치
        const hot = ['부전동', '연산동', '양정동', '중앙대로'];
        const aHot = hot.some(p => aAddr.includes(p)) ? 1 : 0;
        const bHot = hot.some(p => bAddr.includes(p)) ? 1 : 0;
        if (aHot !== bHot) return bHot - aHot;

        return aAddr.length - bAddr.length;
    });

    if (sortedList.length > 0) box.style.display = 'block';

    sortedList.slice(0, 6).forEach(loc => {
        const div = document.createElement('div');
        div.className = 'loc-item';
        const isBusan = loc.address_name.includes('부산');
        const pinColor = isBusan ? '#3b82f6' : '#ef4444';

        div.innerHTML = `
            <div style="display:flex; align-items:center;">
                <span style="color:${pinColor}; margin-right:8px;">📍</span>
                <div>
                    <div style="color:#fff; font-weight:600; font-size:14px;">${loc.address_name}</div>
                    <div style="color:#94a3b8; font-size:12px;">${loc.place_name}</div>
                </div>
            </div>
        `;
        div.onclick = () => {
            box.style.display = 'none';
            document.getElementById('q').value = loc.place_name;
            calculateDist(parseFloat(loc.y), parseFloat(loc.x), loc.place_name);
        };
        box.appendChild(div);
    });
}

// 3. 거리 계산 및 정렬 출력 (텍스트 매칭 보너스 포함)
function calculateDist(uLat, uLng, targetName) {
    const sorted = DATA.map(c => {
        const R = 6371;
        const dLat = (c.lat - uLat) * Math.PI / 180, dLng = (c.lng - uLng) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(uLat*Math.PI/180)*Math.cos(c.lat*Math.PI/180)*Math.sin(dLng/2)**2;
        const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        
        let score = dist;
        // 주소에 검색어(동 이름 등)가 포함되면 우선순위 대폭 상승
        if(c.addr.includes(targetName.split(' ')[0])) score -= 100; 

        return {...c, dist, score};
    }).sort((a,b) => a.score - b.score).slice(0, 5);

    let h = `<div style="font-size:12px; color:#94a3b8; margin:15px 0 10px;">🏢 ${targetName} 기준 주변 결과</div>`;
    h += sorted.map((c, idx) => `
      <div class="res-card" id="card-${idx}" onclick="showOnMap(${c.lat}, ${c.lng}, ${idx})">
        <div style="font-weight:700;">${c.name}</div>
        <div style="font-size:13px; color:#94a3b8; margin:5px 0;">${c.addr}</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="color:var(--success); font-size:12px;">약 ${c.dist.toFixed(1)}km</span>
          <a href="tel:${c.tel}" class="tel-btn" onclick="event.stopPropagation()">📞 전화하기</a>
        </div>
      </div>`).join('');
    
    document.getElementById('out').innerHTML = h;
    document.getElementById('map-container').style.display = 'none';
}

// 4. 지도 표시
function showOnMap(lat, lng, idx) {
    const container = document.getElementById('map-container');
    container.style.display = 'block';

    document.querySelectorAll('.res-card').forEach(c => c.classList.remove('active'));
    document.getElementById('card-' + idx).classList.add('active');

    const pos = new kakao.maps.LatLng(lat, lng);
    if (!map) {
        map = new kakao.maps.Map(container, { center: pos, level: 3 });
        marker = new kakao.maps.Marker({ position: pos, map: map });
    } else {
        map.setCenter(pos);
        marker.setPosition(pos);
    }
    setTimeout(() => map.relayout(), 100);
}
</script>
