function run() {
  kakao.maps.load(() => {
    const query = document.getElementById('q').value.trim();
    if(!query) return;
    const geocoder = new kakao.maps.services.Geocoder();
    geocoder.addressSearch(query, (result, status) => {
      if(status === kakao.maps.services.Status.OK) {
        const uLat = parseFloat(result[0].y), uLng = parseFloat(result[0].x);
        const sorted = DATA.map(c => {
          const R = 6371;
          const dLat = (c.lat - uLat) * Math.PI / 180, dLng = (c.lng - uLng) * Math.PI / 180;
          const a = Math.sin(dLat/2)**2 + Math.cos(uLat*Math.PI/180)*Math.cos(c.lat*Math.PI/180)*Math.sin(dLng/2)**2;
          return {...c, dist: R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))};
        }).sort((a,b) => a.dist - b.dist).slice(0, 3);
        
        let h = `<div style="font-size:12px; color:#94a3b8; margin:15px 0 10px;">📍 ${result[0].address_name} 근처</div>`;
        h += sorted.map(c => `
          <div class="res-card">
            <div style="font-weight:700;">${c.name}</div>
            <div style="font-size:13px; color:#94a3b8; margin:5px 0;">${c.addr}</div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="color:#10b981; font-size:12px;">약 ${c.dist.toFixed(1)}km</span>
              <a href="tel:${c.tel}" class="tel-btn">📞 전화상담</a>
            </div>
          </div>`).join('');
        document.getElementById('out').innerHTML = h;
      } else { alert("지역을 찾지 못했습니다."); }
    });
  });
}
