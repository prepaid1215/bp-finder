<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3157d5">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>BP FINDER+ | 앤텔레콤 모바일 업무 도구</title>
  <style>
    :root{--ink:#111827;--muted:#697386;--line:#e7eaf0;--blue:#3157d5;--blue2:#2446b9;--soft:#eef2ff}
    *{box-sizing:border-box}
    html{background:#eef1f7}
    body{margin:0;color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .site-bg{min-height:100dvh;position:relative;overflow:hidden;background:radial-gradient(circle at 10% 0%,#dfe7ff 0,transparent 34%),radial-gradient(circle at 90% 100%,#dcf8ed 0,transparent 30%),#eef1f7}
    .ambient{position:fixed;border-radius:999px;filter:blur(60px);opacity:.46;pointer-events:none}
    .one{width:270px;height:270px;background:#a5b9ff;top:-120px;right:-120px}
    .two{width:240px;height:240px;background:#9ce3cb;bottom:-130px;left:-110px}
    .app{width:100%;min-height:100dvh;position:relative;z-index:1;background:rgba(249,250,252,.95);padding:18px 18px calc(92px + env(safe-area-inset-bottom))}
    .nav{position:fixed;z-index:20;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 24px);max-width:616px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border:1px solid rgba(214,219,230,.8);border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 16px 42px rgba(22,32,59,.2);backdrop-filter:blur(20px)}
    .nav button{min-height:57px;border:0;border-radius:15px;background:transparent;color:#8790a2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:750}
    .nav button i{font-style:normal;font-size:20px;line-height:1}
    .nav button.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 7px 16px rgba(49,87,213,.3)}
    .frame{height:100dvh;min-height:520px;margin:-18px -18px 0;overflow:hidden;border:0;background:#fff}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;pointer-events:none}
    @media(min-width:680px){
      .site-bg{padding:28px 0}.app{width:640px;min-height:calc(100dvh - 56px);margin:0 auto;padding:24px 30px 38px;border:1px solid rgba(255,255,255,.8);border-radius:30px;box-shadow:0 24px 70px rgba(34,44,74,.15)}
      .nav{position:sticky;top:14px;bottom:auto;transform:none;width:100%;max-width:none;margin-top:20px;background:rgba(241,243,247,.92);box-shadow:0 7px 20px rgba(22,32,59,.07)}
      .nav button{min-height:52px;flex-direction:row;font-size:11px;gap:7px}.nav button i{font-size:17px}
      .frame{height:760px;min-height:640px;margin:20px 0 0;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(33,43,74,.06)}
    }
    @media(max-width:370px){.app{padding-left:13px;padding-right:13px}.frame{margin-left:-13px;margin-right:-13px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="site-bg">
    <div class="ambient one"></div><div class="ambient two"></div>
    <section class="app">
      <nav class="nav" aria-label="업무 도구 선택">
        <button type="button" data-tool="center"><i aria-hidden="true">⌖</i>센터 찾기</button>
        <button type="button" data-tool="esim"><i aria-hidden="true">▣</i>eSIM 모델명</button>
        <button type="button" data-tool="delivery"><i aria-hidden="true">▤</i>당일유심</button>
      </nav>
      <div class="frame"><iframe id="toolFrame" title="BP FINDER 센터 찾기" allow="geolocation; clipboard-read; clipboard-write"></iframe></div>
    </section>
  </main>
  <script>
    const VERSION="20260822-2";
    const TOOLS={
      center:{title:"가까운 센터 찾기",eyebrow:"BP FINDER",description:"지역을 입력하면 가까운 공식 센터를 거리순으로 보여드려요.",src:"./tools/center/index.html"},
      esim:{title:"eSIM 모델명 만들기",eyebrow:"DEVICE TOOL",description:"기종과 용량을 선택해 앤텔레콤 입력용 모델명을 완성하세요.",src:"./tools/esim/index.html"},
      delivery:{title:"당일유심 배송조회",eyebrow:"USIM DELIVERY",description:"주소와 접수 시간을 기준으로 당일 배송 가능 여부를 확인하세요.",src:"./tools/delivery/index.html"}
    };
    const frame=document.getElementById("toolFrame");
    const buttons=[...document.querySelectorAll("[data-tool]")];
    let current="";
    function renderTool(name){
      if(!TOOLS[name])name="center";
      const tool=TOOLS[name];
      buttons.forEach(button=>{const active=button.dataset.tool===name;button.classList.toggle("active",active);if(active)button.setAttribute("aria-current","page");else button.removeAttribute("aria-current")});
      if(current!==name){frame.src=tool.src+"?v="+VERSION;frame.title=tool.title;current=name}
    }
    buttons.forEach(button=>button.addEventListener("click",()=>{location.hash=button.dataset.tool}));
    window.addEventListener("hashchange",()=>renderTool(location.hash.slice(1)));
    renderTool(location.hash.slice(1)||"center");
  </script>
</body>
</html>
